<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Shirudo concepts and their scx-conductor counterparts"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/></marker></defs><rect width="1100" height="560" fill="#ffffff"/><text x="550.0" y="22" font-size="16" font-weight="700" text-anchor="middle" fill="#1a202c">Shirudo concepts and their scx-conductor counterparts</text><rect x="30" y="40" width="480" height="30" rx="8" fill="#FDF3E1" stroke="#B7791F" stroke-width="1.5"/><text x="270.0" y="60" font-size="12" font-weight="700" text-anchor="middle" fill="#1a202c">Shirudo (OpenAI + Cisco): eBPF 'shields' for running Linux systems</text><rect x="590" y="40" width="480" height="30" rx="8" fill="#EAF2FB" stroke="#2B6CB0" stroke-width="1.5"/><text x="830.0" y="60" font-size="12" font-weight="700" text-anchor="middle" fill="#1a202c">scx-conductor: sched_ext schedulers for running workloads</text><rect x="30" y="90" width="480" height="38" rx="8" fill="#FDF3E1" stroke="#B7791F" stroke-width="1.5"/><text x="270.0" y="114.5" font-size="11" text-anchor="middle" fill="#2d3748">Shield: small eBPF program attached to a live system</text><rect x="590" y="90" width="480" height="38" rx="8" fill="#EAF2FB" stroke="#2B6CB0" stroke-width="1.5"/><text x="830.0" y="114.5" font-size="11" text-anchor="middle" fill="#2d3748">Scheduler: struct_ops program specialised per workload</text><line x1="512" y1="109" x2="588" y2="109" stroke="#4A5568" stroke-width="1.6" marker-end="url(#ah)"/><rect x="30" y="138" width="480" height="38" rx="8" fill="#FDF3E1" stroke="#B7791F" stroke-width="1.5"/><text x="270.0" y="162.5" font-size="11" text-anchor="middle" fill="#2d3748">Agents generate and validate shields per vulnerability</text><rect x="590" y="138" width="480" height="38" rx="8" fill="#EAF2FB" stroke="#2B6CB0" stroke-width="1.5"/><text x="830.0" y="162.5" font-size="11" text-anchor="middle" fill="#2d3748">LLM backend writes the scheduler C on the device; gates + build + kernel verifier</text><line x1="512" y1="157" x2="588" y2="157" stroke="#4A5568" stroke-width="1.6" marker-end="url(#ah)"/><rect x="30" y="186" width="480" height="38" rx="8" fill="#FDF3E1" stroke="#B7791F" stroke-width="1.5"/><text x="270.0" y="210.5" font-size="11" text-anchor="middle" fill="#2d3748">Test the shield against exploit and real workloads</text><rect x="590" y="186" width="480" height="38" rx="8" fill="#EAF2FB" stroke="#2B6CB0" stroke-width="1.5"/><text x="830.0" y="210.5" font-size="11" text-anchor="middle" fill="#2d3748">Canary in SWITCH_PARTIAL mode: latency probe, starvation, telemetry</text><line x1="512" y1="205" x2="588" y2="205" stroke="#4A5568" stroke-width="1.6" marker-end="url(#ah)"/><rect x="30" y="234" width="480" height="38" rx="8" fill="#FDF3E1" stroke="#B7791F" stroke-width="1.5"/><text x="270.0" y="258.5" font-size="11" text-anchor="middle" fill="#2d3748">Monitor impact before enforcing</text><rect x="590" y="234" width="480" height="38" rx="8" fill="#EAF2FB" stroke="#2B6CB0" stroke-width="1.5"/><text x="830.0" y="258.5" font-size="11" text-anchor="middle" fill="#2d3748">Partial mode: only opted-in tasks are scheduled by it</text><line x1="512" y1="253" x2="588" y2="253" stroke="#4A5568" stroke-width="1.6" marker-end="url(#ah)"/><rect x="30" y="282" width="480" height="38" rx="8" fill="#FDF3E1" stroke="#B7791F" stroke-width="1.5"/><text x="270.0" y="306.5" font-size="11" text-anchor="middle" fill="#2d3748">Operator approves what is deployed</text><rect x="590" y="282" width="480" height="38" rx="8" fill="#EAF2FB" stroke="#2B6CB0" stroke-width="1.5"/><text x="830.0" y="306.5" font-size="11" text-anchor="middle" fill="#2d3748">gen-approve signs the digests; approved_only platforms never generate</text><line x1="512" y1="301" x2="588" y2="301" stroke="#4A5568" stroke-width="1.6" marker-end="url(#ah)"/><rect x="30" y="330" width="480" height="38" rx="8" fill="#FDF3E1" stroke="#B7791F" stroke-width="1.5"/><text x="270.0" y="354.5" font-size="11" text-anchor="middle" fill="#2d3748">Signed and verified before loading; kernel verifier</text><rect x="590" y="330" width="480" height="38" rx="8" fill="#EAF2FB" stroke="#2B6CB0" stroke-width="1.5"/><text x="830.0" y="354.5" font-size="11" text-anchor="middle" fill="#2d3748">Ed25519 manifest pins obj/loader/source/approval digests; kernel verifier</text><line x1="512" y1="349" x2="588" y2="349" stroke="#4A5568" stroke-width="1.6" marker-end="url(#ah)"/><rect x="30" y="378" width="480" height="38" rx="8" fill="#FDF3E1" stroke="#B7791F" stroke-width="1.5"/><text x="270.0" y="402.5" font-size="11" text-anchor="middle" fill="#2d3748">Live protection, no restart, removable</text><rect x="590" y="378" width="480" height="38" rx="8" fill="#EAF2FB" stroke="#2B6CB0" stroke-width="1.5"/><text x="830.0" y="402.5" font-size="11" text-anchor="middle" fill="#2d3748">Hot load / unload; closing the link ⇒ stock scheduler</text><line x1="512" y1="397" x2="588" y2="397" stroke="#4A5568" stroke-width="1.6" marker-end="url(#ah)"/><rect x="30" y="426" width="480" height="38" rx="8" fill="#FDF3E1" stroke="#B7791F" stroke-width="1.5"/><text x="270.0" y="450.5" font-size="11" text-anchor="middle" fill="#2d3748">TPM-backed record of load / removal</text><rect x="590" y="426" width="480" height="38" rx="8" fill="#EAF2FB" stroke="#2B6CB0" stroke-width="1.5"/><text x="830.0" y="450.5" font-size="11" text-anchor="middle" fill="#2d3748">Hash-chained audit log, head extended into a TPM PCR</text><line x1="512" y1="445" x2="588" y2="445" stroke="#4A5568" stroke-width="1.6" marker-end="url(#ah)"/><rect x="30" y="474" width="480" height="38" rx="8" fill="#FDF3E1" stroke="#B7791F" stroke-width="1.5"/><text x="270.0" y="498.5" font-size="11" text-anchor="middle" fill="#2d3748">Same operation can be exploit or legitimate request</text><rect x="590" y="474" width="480" height="38" rx="8" fill="#EAF2FB" stroke="#2B6CB0" stroke-width="1.5"/><text x="830.0" y="498.5" font-size="11" text-anchor="middle" fill="#2d3748">Same CPU can be a game or a build: classify, don't guess</text><line x1="512" y1="493" x2="588" y2="493" stroke="#4A5568" stroke-width="1.6" marker-end="url(#ah)"/><text x="550" y="538" font-size="11" text-anchor="middle" fill="#2d3748" font-style="italic">Added because scheduling differs from security: kernel watchdog ejects stalls on its own; PSI + latency SLO guard triggers rollback.</text></svg>
