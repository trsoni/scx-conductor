<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 770" width="1200" height="770" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Sequence: game launches → scheduler generated, verified, canaried, loaded; game exits → unloaded"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/></marker></defs><rect width="1200" height="770" fill="#ffffff"/><text x="600.0" y="22" font-size="16" font-weight="700" text-anchor="middle" fill="#1a202c">Sequence: game launches → scheduler generated, verified, canaried, loaded; game exits → unloaded</text><rect x="25" y="40" width="130" height="44" rx="8" fill="#EAF2FB" stroke="#2B6CB0" stroke-width="1.5"/><text x="90.0" y="60" font-size="12" font-weight="700" text-anchor="middle" fill="#1a202c">App / user</text><line x1="90" y1="84" x2="90" y2="735" stroke="#A0AEC0" stroke-width="1" stroke-dasharray="4 4"/><rect x="195" y="40" width="130" height="44" rx="8" fill="#EAF2FB" stroke="#2B6CB0" stroke-width="1.5"/><text x="260.0" y="60" font-size="12" font-weight="700" text-anchor="middle" fill="#1a202c">Collector +</text><text x="260.0" y="79" font-size="11" text-anchor="middle" fill="#2d3748">Classifier</text><line x1="260" y1="84" x2="260" y2="735" stroke="#A0AEC0" stroke-width="1" stroke-dasharray="4 4"/><rect x="365" y="40" width="130" height="44" rx="8" fill="#EAF2FB" stroke="#2B6CB0" stroke-width="1.5"/><text x="430.0" y="60" font-size="12" font-weight="700" text-anchor="middle" fill="#1a202c">Policy + Forge</text><line x1="430" y1="84" x2="430" y2="735" stroke="#A0AEC0" stroke-width="1" stroke-dasharray="4 4"/><rect x="535" y="40" width="130" height="44" rx="8" fill="#EAF2FB" stroke="#2B6CB0" stroke-width="1.5"/><text x="600.0" y="60" font-size="12" font-weight="700" text-anchor="middle" fill="#1a202c">Verifier</text><line x1="600" y1="84" x2="600" y2="735" stroke="#A0AEC0" stroke-width="1" stroke-dasharray="4 4"/><rect x="705" y="40" width="130" height="44" rx="8" fill="#EAF2FB" stroke="#2B6CB0" stroke-width="1.5"/><text x="770.0" y="60" font-size="12" font-weight="700" text-anchor="middle" fill="#1a202c">Lifecycle</text><line x1="770" y1="84" x2="770" y2="735" stroke="#A0AEC0" stroke-width="1" stroke-dasharray="4 4"/><rect x="875" y="40" width="130" height="44" rx="8" fill="#EAF2FB" stroke="#2B6CB0" stroke-width="1.5"/><text x="940.0" y="60" font-size="12" font-weight="700" text-anchor="middle" fill="#1a202c">conductor_load</text><line x1="940" y1="84" x2="940" y2="735" stroke="#A0AEC0" stroke-width="1" stroke-dasharray="4 4"/><rect x="1045" y="40" width="130" height="44" rx="8" fill="#EAF2FB" stroke="#2B6CB0" stroke-width="1.5"/><text x="1110.0" y="60" font-size="12" font-weight="700" text-anchor="middle" fill="#1a202c">Kernel</text><text x="1110.0" y="79" font-size="11" text-anchor="middle" fill="#2d3748">sched_ext</text><line x1="1110" y1="84" x2="1110" y2="735" stroke="#A0AEC0" stroke-width="1" stroke-dasharray="4 4"/><line x1="90" y1="116" x2="260" y2="116" stroke="#4A5568" stroke-width="1.6" marker-end="url(#ah)"/><text x="175.0" y="111" font-size="10" text-anchor="middle" fill="#2d3748" font-style="italic">launch: comm=steam, drm fds</text><text x="272" y="144" font-size="10" text-anchor="start" fill="#2d3748" font-style="italic">classify + debounce</text><line x1="260" y1="172" x2="430" y2="172" stroke="#4A5568" stroke-width="1.6" marker-end="url(#ah)"/><text x="345.0" y="167" font-size="10" text-anchor="middle" fill="#2d3748" font-style="italic">workload = gaming</text><text x="442" y="200" font-size="10" text-anchor="start" fill="#2d3748" font-style="italic">params = f(workload, platform, power)</text><line x1="430" y1="228" x2="770" y2="228" stroke="#4A5568" stroke-width="1.6" marker-end="url(#ah)"/><text x="600.0" y="223" font-size="10" text-anchor="middle" fill="#2d3748" font-style="italic">signed manifest</text><line x1="770" y1="262" x2="600" 