d="url(#ah)"/><text x="1025.0" y="551" font-size="10" text-anchor="middle" fill="#2d3748" font-style="italic">update tgid_class map</text><line x1="770" y1="590" x2="940" y2="590" stroke="#4A5568" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="855.0" y="585" font-size="10" text-anchor="middle" fill="#2d3748" font-style="italic">stats every 5 ticks</text><line x1="90" y1="624" x2="260" y2="624" stroke="#4A5568" stroke-width="1.6" marker-end="url(#ah)"/><text x="175.0" y="619" font-size="10" text-anchor="middle" fill="#2d3748" font-style="italic">game exits, idle past dwell</text><line x1="770" y1="658" x2="940" y2="658" stroke="#4A5568" stroke-width="1.6" marker-end="url(#ah)"/><text x="855.0" y="653" font-size="10" text-anchor="middle" fill="#2d3748" font-style="italic">quit  (reason: stock)</text><line x1="940" y1="692" x2="1110" y2="692" stroke="#4A5568" stroke-width="1.6" marker-end="url(#ah)"/><text x="1025.0" y="687" font-size="10" text-anchor="middle" fill="#2d3748" font-style="italic">link closed: fair class</text><text x="600.0" y="750" font-size="11" text-anchor="middle" fill="#2d3748" font-style="italic">audit log records: decision, canary-start/result, load, unload. Guard ticks watch PSI and the FG/MEDIA latency tail and roll back on regression.</text></svg>
