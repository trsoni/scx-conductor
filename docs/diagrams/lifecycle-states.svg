<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 610" width="1100" height="610" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Scheduler lifecycle (per manifest): only VERIFY → CANARY/LOADING ever loads code, and VERIFY fails closed"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/></marker></defs><rect width="1100" height="610" fill="#ffffff"/><text x="550.0" y="22" font-size="16" font-weight="700" text-anchor="middle" fill="#1a202c">Scheduler lifecycle (per manifest): only VERIFY → CANARY/LOADING ever loads code, and VERIFY fails closed</text><rect x="30" y="210" width="140" height="70" rx="8" fill="#E9F6EC" stroke="#2F855A" stroke-width="1.5"/><text x="100.0" y="231" font-size="13" font-weight="700" text-anchor="middle" fill="#1a202c">STOCK</text><text x="100.0" y="250" font-size="11" text-anchor="middle" fill="#2d3748">fair class</text><text x="100.0" y="265" font-size="11" text-anchor="middle" fill="#2d3748">nothing custom loaded</text><rect x="290" y="210" width="160" height="70" rx="8" fill="#EAF2FB" stroke="#2B6CB0" stroke-width="1.5"/><text x="370.0" y="231" font-size="13" font-weight="700" text-anchor="middle" fill="#1a202c">VERIFY</text><text x="370.0" y="249" font-size="10" text-anchor="middle" fill="#2d3748">signature · BPF digest</text><text x="370.0" y="263" font-size="10" text-anchor="middle" fill="#2d3748">platform · arch · TTL · bounds</text><rect x="540" y="90" width="170" height="76" rx="8" fill="#EAF2FB" stroke="#2B6CB0" stroke-width="1.5"/><text x="625.0" y="111" font-size="13" font-weight="700" text-anchor="middle" fill="#1a202c">CANARY</text><text x="625.0" y="129" font-size="10" text-anchor="middle" fill="#2d3748">partial mode + probe</text><text x="625.0" y="143" font-size="10" text-anchor="middle" fill="#2d3748">p99 under budget?</text><text x="625.0" y="157" font-size="10" text-anchor="middle" fill="#C53030">✕ fail → quarantine</text><rect x="540" y="330" width="170" height="76" rx="8" fill="#EAF2FB" stroke="#2B6CB0" stroke-width="1.5"/><text x="625.0" y="351" font-size="13" font-weight="700" text-anchor="middle" fill="#1a202c">LOADING</text><text x="625.0" y="369" font-size="10" text-anchor="middle" fill="#2d3748">full struct_ops load</text><text x="625.0" y="383" font-size="10" text-anchor="middle" fill="#2d3748">sysfs enabled + ops name</text><text x="625.0" y="397" font-size="10" text-anchor="middle" fill="#C53030">✕ fail → quarantine</text><rect x="850" y="210" width="170" height="70" rx="8" fill="#E9F6EC" stroke="#2F855A" stroke-width="1.5"/><text x="935.0" y="231" font-size="13" font-weight="700" text-anchor="middle" fill="#1a202c">ACTIVE</text><text x="935.0" y="250" font-size="11" text-anchor="middle" fill="#2d3748">guard ticks: PSI,</text><text x="935.0" y="265" font-size="11" text-anchor="middle" fill="#2d3748">latency SLO, liveness</text><rect x="500" y="485" width="280" height="62" rx="8" fill="#FDECEC" stroke="#C53030" stroke-width="1.5"/><text x="640.0" y="506" font-size="13" font-weight="700" text-anchor="middle" fill="#1a202c">QUARANTINE</text><text x="640.0" y="524" font-size="10" text-anchor="middle" fill="#2d3748">manifest blocked 300 s (slo.quarantine_s);</text><text x="640.0" y="538" font-size="10" text-anchor="middle" fill="#2d3748">system keeps running on STOCK</text><line x1="170" y1="245" x2="290" y2="245" stroke="#4A5568" stroke-width="1.6" marker-end="url(#ah)"/><text x="230" y="232" font-size="10" text-anchor="middle" fill="#2d3748" font-style="italic">workload changed</text><text x="230" y="264" font-size="10" text-anchor="middle" fill="#2d3748" font-style="italic">(confirmed + dwell)</text><polyline points="450,225 495,225 495,128 540,128" fill="none" stroke="#4A5568" stroke-width="1.6" marker-end="url(#ah)"/><text x="488" y="175" font-size="10" text-anchor="end" fill="#2d3748" font-style="italic">canary required</text><polyline points="450,265 495,265 495,368 540,368" fill="none" stroke="#4A5568" stroke-width="1.6" marker-end="url(#ah)"/><text x="488" y="322" font-size="10" text-anchor="end" fill="#2d3748" font-style="italic">no canary / already passed</text><line x1="625" y1="166" x2="625" y2="330" stroke="#4A5568" stroke-width="1.6" marker-end="url(#ah)"/><text x="633" y="252" font-size="10" text-anchor="start" fill="#2d3748" font-style="italic">canary passed</text><polyline points="710,380 790,380 790,262 850,262" fill="none" stroke="#4A5568" stroke-width="1.6" marker-end="url(#ah)"/><text x="798" y="330" font-size="10" text-anchor="start" fill="#2d3748" font-style="italic">loaded</text><polyline points="935,210 935,58 370,58 370,210" fill="none" stroke="#4A5568" stroke-width="1.6" marker-end="url(#ah)"/><text x="652" y="52" font-size="10" text-anchor="middle" fill="#2d3748" font-style="italic">workload or power state changed: unload old, verify new</text><polyline points="980,280 980,585 100,585 100,280" fill="none" stroke="#4A5568" stroke-width="1.6" marker-end="url(#ah)"/><text x="540" y="579" font-size="10" text-anchor="middle" fill="#2d3748" font-style="italic">workload idle / unknown: unload, back to STOCK</text><polyline points="880,280 880,516 780,516" fill="none" stroke="#4A5568" stroke-width="1.6" marker-end="url(#ah)"/><text x="872" y="440" font-size="10" text-anchor="end" fill="#2d3748" font-style="italic">PSI / latency SLO rollback,</text><text x="872" y="454" font-size="10" text-anchor="end" fill="#2d3748" font-style="italic">kernel watchdog eject,</text><text x="872" y="468" font-size="10" text-anchor="end" fill="#2d3748" font-style="italic">loader died</text></svg>
