<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 930" width="1100" height="930" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="scx-conductor architecture: observe → classify → specialise → sign/verify → load/unload sched_ext"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/></marker></defs><rect width="1100" height="930" fill="#ffffff"/><text x="550.0" y="22" font-size="16" font-weight="700" text-anchor="middle" fill="#1a202c">scx-conductor architecture: observe → classify → specialise → sign/verify → load/unload sched_ext</text><rect x="30" y="38" width="205" height="70" rx="8" fill="#F4F4F5" stroke="#71717A" stroke-width="1.5"/><text x="132.5" y="59" font-size="13" font-weight="700" text-anchor="middle" fill="#1a202c">/proc per-process</text><text x="132.5" y="78" font-size="11" text-anchor="middle" fill="#2d3748">CPU %, comm, fd targets:</text><text x="132.5" y="93" font-size="11" text-anchor="middle" fill="#2d3748">/dev/dri video* media* snd</text><line x1="132.5" y1="108" x2="132.5" y2="128" stroke="#4A5568" stroke-width="1.6" marker-end="url(#ah)"/><rect x="248" y="38" width="170" height="70" rx="8" fill="#F4F4F5" stroke="#71717A" stroke-width="1.5"/><text x="333.0" y="59" font-size="13" font-weight="700" text-anchor="middle" fill="#1a202c">Pressure &amp; rates</text><text x="333.0" y="78" font-size="11" text-anchor="middle" fill="#2d3748">PSI /proc/pressure/cpu</text><text x="333.0" y="93" font-size="11" text-anchor="middle" fill="#2d3748">fork rate, CPU util</text><line x1="333.0" y1="108" x2="333.0" y2="128" stroke="#4A5568" stroke-width="1.6" marker-end="url(#ah)"/><rect x="431" y="38" width="185" height="70" rx="8" fill="#F4F4F5" stroke="#71717A" stroke-width="1.5"/><text x="523.5" y="59" font-size="13" font-weight="700" text-anchor="middle" fill="#1a202c">Power / thermal / GPU</text><text x="523.5" y="78" font-size="11" text-anchor="middle" fill="#2d3748">AC / battery %, thermal</text><text x="523.5" y="93" font-size="11" text-anchor="middle" fill="#2d3748">gpu_busy_percent (DRM)</text><line x1="523.5" y1="108" x2="523.5" y2="128" stroke="#4A5568" stroke-width="1.6" marker-end="url(#ah)"/><rect x="629" y="38" width="161" height="70" rx="8" fill="#F4F4F5" stroke="#71717A" stroke-width="1.5"/><text x="709.5" y="59" font-size="13" font-weight="700" text-anchor="middle" fill="#1a202c">Platform hints</text><text x="709.5" y="78" font-size="11" text-anchor="middle" fill="#2d3748">hint.json · ctl hint</text><text x="709.5" y="93" font-size="11" text-anchor="middle" fill="#2d3748">top-app · HMI · shell</text><line x1="709.5" y1="108" x2="709.5" y2="128" stroke="#4A5568" stroke-width="1.6" marker-end="url(#ah)"/><rect x="30" y="130" width="760" height="340" rx="10" fill="#EAF2FB" stroke="#2B6CB0" stroke-width="1.5"/><text x="410" y="150" font-size="13" text-anchor="middle" fill="#1a365d" font-weight="700">conductord — governor (userspace Python, stdlib only; no BPF bindings)</text><rect x="50" y="170" width="160" height="62" rx="8" fill="#FFFFFF" stroke="#4A5568" stroke-width="1.5"/><text x="130.0" y="191" font-size="13" font-weight="700" text-anchor="middle" fill="#1a202c">Collector</text><text x="130.0" y="210" font-size="11" text-anchor="middle" fill="#2d3748">/proc /sys PSI hints</text><text x="130.0" y="225" font-size="11" text-anchor="middle" fill="#2d3748">fd tags: drm v4l snd</text><rect x="240" y="170" width="160" height="62" rx="8" fill="#FFFFFF" stroke="#4A5568" stroke-width="1.5"/><text x="320.0" y="191" font-size="13" font-weight="700" text-anchor="middle" fill="#1a202c">Classifier</text><text x="320.0" y="210" font-size="11" text-anchor="middle" fill="#2d3748">rules + hysteresis →</text><text x="320.0" y="225" font-size="11" text-anchor="middle" fill="#2d3748">workload + per-pid class</text><rect x="430" y="170" width="160" height="62" rx="8" fill="#FFFFFF" stroke="#4A5568" stroke-width="1.5"/><text x="510.0" y="191" font-size="13" font-weight="700" text-anchor="middle" fill="#1a202c">Policy</text><text x="510.0" y="210" font-size="11" text-anchor="middle" fill="#2d3748">workload × platform</text><text x="510.0" y="225" font-size="11" text-anchor="middle" fill="#2d3748">× power state → Params</text><rect x="620" y="170" width="150" height="62" rx="8" fill="#FFFFFF" stroke="#4A5568" stroke-width="1.5"/><text x="695.0" y="191" font-size="13" font-weight="700" text-anchor="middle" fill="#1a202c">Forge</text><text x="695.0" y="210" font-size="11" text-anchor="middle" fill="#2d3748">bounded Params →</text><text x="695.0" y="225" font-size="11" text-anchor="middle" fill="#2d3748">Ed25519 manifest</text><line x1="210" y1="201" x2="240" y2="201" stroke="#4A5568" stroke-width="1.6" marker-end="url(#ah)"/><line x1="400" y1="201" x2="430" y2="201" stroke="#4A5568" stroke-width="1.6" marker-end="url(#ah)"/><line x1="590" y1="201" x2="620" y2="201" stroke="#4A5568" stroke-width="1.6" marker-end="url(#ah)"/><rect x="620" y="262" width="150" height="98" rx="8" fill="#FFFFFF" stroke="#4A5568" stroke-width="1.5"/><text x="695.0" y="283" font-size="13" font-weight="700" text-anchor="middle" fill="#1a202c">Verifier</text><text x="695.0" y="301" font-size="10" text-anchor="middle" fill="#2d3748">fail-closed:</text><text x="695.0" y="315" font-size="10" text-anchor="middle" fill="#2d3748">signature · BPF digest</text><text x="695.0" y="329" font-size="10" text-anchor="middle" fill="#2d3748">platform · arch · TTL</text><text x="695.0" y="343" font-size="10" text-anchor="middle" fill="#2d3748">param bounds</text><line x1="695" y1="232" x2="695" y2="262" stroke="#4A5568" stroke-width="1.6" marker-end="url(#ah)"/><rect x="50" y="262" width="160" height="62" rx="8" fill="#FFFFFF" stroke="#4A5568" stroke-width="1.5"/><text x="130.0" y="283" font-size="13" font-weight="700" text-anchor="middle" fill="#1a202c">Control socket</text><text x="130.0" y="302" font-size="11" text-anchor="middle" fill="#2d3748">status · hint · hold</text><text x="130.0" y="317" font-size="11" text-anchor="middle" fill="#2d3748">release · rollback</text><line x1="210" y1="280" x2="330" y2="233" stroke="#4A5568" stroke-width="1.6" marker-end="url(#ah)"/><text x="262" y="244" font-size="10" text-anchor="middle" fill="#4A5568" font-style="italic">hint / hold</text><rect x="380" y="262" width="215" height="112" rx="8" fill="#FFFFFF" stroke="#4A5568" stroke-width="1.5"/><text x="487.5" y="283" font-size="13" font-weight="700" text-anchor="middle" fill="#1a202c">Lifecycle</text><text x="487.5" y="302" font-size="11" text-anchor="middle" fill="#2d3748">1 canary (SWITCH_PARTIAL)</text><text x="487.5" y="317" font-size="11" text-anchor="middle" fill="#2d3748">2 load + sync classes</text><text x="487.5" y="332" font-size="11" text-anchor="middle" fill="#2d3748">3 guard: PSI + latency SLO</text><text x="487.5" y="347" font-size="11" text-anchor="middle" fill="#2d3748">4 rollback / quarantine</text><line x1="620" y1="301" x2="595" y2="301" stroke="#4A5568" stroke-width="1.6" marker-end="url(#ah)"/><rect x="50" y="350" width="295" height="96" rx="8" fill="#FFFFFF" stroke="#4A5568" stroke-width="1.5"/><text x="197.5" y="371" font-size="13" font-weight="700" text-anchor="middle" fill="#1a202c">Audit log</text><text x="197.5" y="389" font-size="10" text-anchor="middle" fill="#2d3748">hash-chained JSONL: every decision,</text><text x="197.5" y="403" font-size="10" text-anchor="middle" fill="#2d3748">load, unload, rejection, rollback;</text><text x="197.5" y="417" font-size="10" text-anchor="middle" fill="#2d3748">head extended into a TPM PCR</text><text x="197.5" y="431" font-size="10" text-anchor="middle" fill="#2d3748">when a TPM is present</text><line x1="380" y1="345" x2="346" y2="380" stroke="#4A5568" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/><rect x="830" y="38" width="240" height="292" rx="8" fill="#FDF3E1" stroke="#B7791F" stroke-width="1.5"/><text x="950.0" y="59" font-size="13" font-weight="700" text-anchor="middle" fill="#1a202c">Forge host / CI (offline)</text><text x="950.0" y="78" font-size="11" text-anchor="middle" fill="#2d3748">holds the private key</text><text x="950.0" y="93" font-size="11" text-anchor="middle" fill="#2d3748"></text><text x="950.0" y="108" font-size="11" text-anchor="middle" fill="#2d3748">reviewed BPF object digest</text><text x="950.0" y="123" font-size="11" text-anchor="middle" fill="#2d3748"></text><text x="950.0" y="138" font-size="11" text-anchor="middle" fill="#2d3748">pre-signs manifests for</text><text x="950.0" y="153" font-size="11" text-anchor="middle" fill="#2d3748">iot + automotive</text><text x="950.0" y="168" font-size="11" text-anchor="middle" fill="#2d3748"></text><text x="950.0" y="183" font-size="11" text-anchor="middle" fill="#2d3748">approved_only platforms:</text><text x="950.0" y="198" font-size="11" text-anchor="middle" fill="#2d3748">manifests never signed</text><text x="950.0" y="213" font-size="11" text-anchor="middle" fill="#2d3748">on the device</text><line x1="830" y1="301" x2="772" y2="301" stroke="#4A5568" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="800" y="293" font-size="10" text-anchor="middle" fill="#4A5568" font-style="italic">approved</text><rect x="30" y="500" width="560" height="92" rx="8" fill="#EAF2FB" stroke="#2B6CB0" stroke-width="1.5"/><text x="310.0" y="520" font-size="12" font-weight="700" text-anchor="middle" fill="#1a202c">conductor_load  (C + libbpf, one process per loaded scheduler)</text><text x="310.0" y="538" font-size="10" text-anchor="middle" fill="#2d3748">writes rodata knobs BEFORE load → verifier sees constants (a genuinely different program per profile)</text><text x="310.0" y="552" font-size="10" text-anchor="middle" fill="#2d3748">owns the struct_ops link · stdin: set/clr &lt;tgid&gt; &lt;class&gt; · stdout: stats JSON</text><text x="310.0" y="566" font-size="10" text-anchor="middle" fill="#2d3748">exit == unload: closing the link returns every task to the fair class</text><line x1="487" y1="374" x2="487" y2="500" stroke="#4A5568" stroke-width="1.6" marker-end="url(#ah)"/><text x="497" y="440" font-size="10" text-anchor="start" fill="#4A5568" font-style="italic">spawn + line protocol</text><rect x="620" y="500" width="450" height="92" rx="8" fill="#FDECEC" stroke="#C53030" stroke-width="1.5"/><text x="632" y="520" font-size="12" font-weight="700" text-anchor="start" fill="#1a202c">Fail-safe by construction</text><text x="632" y="538" font-size="10" text-anchor="start" fill="#2d3748">kernel watchdog (timeout_ms) ejects a stalled scheduler</text><text x="632" y="552" font-size="10" text-anchor="start" fill="#2d3748">canary runs in SCHED_EXT-only mode before any full load</text><text x="632" y="566" font-size="10" text-anchor="start" fill="#2d3748">failed / ejected / regressing manifests are quarantined</text><text x="632" y="580" font-size="10" text-anchor="start" fill="#2d3748">idle or unknown ⇒ stock scheduler, nothing custom loaded</text><rect x="30" y="630" width="1040" height="150" rx="10" fill="#E9F6EC" stroke="#2F855A" stroke-width="1.5"/><text x="550" y="650" font-size="13" text-anchor="middle" fill="#1c4532" font-weight="700">Linux kernel — sched_ext (CONFIG_SCHED_CLASS_EXT)</text><rect x="50" y="664" width="500" height="100" rx="8" fill="#FFFFFF" stroke="#4A5568" stroke-width="1.5"/><text x="300.0" y="684" font-size="12" font-weight="700" text-anchor="middle" fill="#1a202c">scx_conductor  (BPF struct_ops)</text><text x="300.0" y="702" font-size="10" text-anchor="middle" fill="#2d3748">select_cpu · enqueue · dispatch · running · stopping · enable</text><text x="300.0" y="716" font-size="10" text-anchor="middle" fill="#2d3748">one shared vtime DSQ  ⇒ starvation-free by construction</text><text x="300.0" y="730" font-size="10" text-anchor="middle" fill="#2d3748">per-class slice, sleeper credit, vtime charge, cpuperf hint</text><text x="300.0" y="744" font-size="10" text-anchor="middle" fill="#2d3748">per-class enqueue→run latency histogram (the SLO signal)</text><rect x="575" y="664" width="230" height="100" rx="8" fill="#FFFFFF" stroke="#4A5568" stroke-width="1.5"/><text x="690.0" y="684" font-size="12" font-weight="700" text-anchor="middle" fill="#1a202c">BPF maps</text><text x="690.0" y="702" font-size="10" text-anchor="middle" fill="#2d3748">tgid_class  (governor writes)</text><text x="690.0" y="716" font-size="10" text-anchor="middle" fill="#2d3748">stats, lat_hist  (per-CPU)</text><text x="690.0" y="730" font-size="10" text-anchor="middle" fill="#2d3748">task_ctx  (task storage)</text><rect x="830" y="664" width="220" height="100" rx="8" fill="#FFFFFF" stroke="#4A5568" stroke-width="1.5"/><text x="940.0" y="684" font-size="12" font-weight="700" text-anchor="middle" fill="#1a202c">Fallbacks</text><text x="940.0" y="702" font-size="10" text-anchor="middle" fill="#2d3748">fair class (stock CFS/EEVDF)</text><text x="940.0" y="716" font-size="10" text-anchor="middle" fill="#2d3748">SysRq-S · watchdog · error</text><text x="940.0" y="730" font-size="10" text-anchor="middle" fill="#2d3748">⇒ revert all tasks</text><line x1="200" y1="592" x2="200" y2="664" stroke="#4A5568" stroke-width="1.6" marker-end="url(#ah)"/><text x="208" y="616" font-size="10" text-anchor="start" fill="#4A5568" font-style="italic">load · map updates</text><line x1="420" y1="664" x2="420" y2="592" stroke="#4A5568" stroke-width="1.6" marker-end="url(#ah)"/><text x="428" y="616" font-size="10" text-anchor="start" fill="#4A5568" font-style="italic">stats · exit info</text><text x="550" y="812" font-size="13" text-anchor="middle" fill="#44337a" font-weight="700">Deployment profiles (profiles/profiles.json) — same code on x86_64 and arm64, CO-RE BPF</text><rect x="30" y="826" width="196" height="84" rx="8" fill="#F1ECFA" stroke="#6B46C1" stroke-width="1.5"/><text x="128.0" y="846" font-size="12" font-weight="700" text-anchor="middle" fill="#1a202c">laptop</text><text x="128.0" y="864" font-size="10" text-anchor="middle" fill="#2d3748">generate on device</text><text x="128.0" y="878" font-size="10" text-anchor="middle" fill="#2d3748">canary · 5 s watchdog</text><text x="128.0" y="892" font-size="10" text-anchor="middle" fill="#2d3748">AC / battery / thermal caps</text><rect x="240" y="826" width="196" height="84" rx="8" fill="#F1ECFA" stroke="#6B46C1" stroke-width="1.5"/><text x="338.0" y="846" font-size="12" font-weight="700" text-anchor="middle" fill="#1a202c">mobile</text><text x="338.0" y="864" font-size="10" text-anchor="middle" fill="#2d3748">generate on device</text><text x="338.0" y="878" font-size="10" text-anchor="middle" fill="#2d3748">canary · 3 s watchdog</text><text x="338.0" y="892" font-size="10" text-anchor="middle" fill="#2d3748">tighter battery + thermal</text><rect x="450" y="826" width="196" height="84" rx="8" fill="#F1ECFA" stroke="#6B46C1" stroke-width="1.5"/><text x="548.0" y="846" font-size="12" font-weight="700" text-anchor="middle" fill="#1a202c">iot</text><text x="548.0" y="864" font-size="10" text-anchor="middle" fill="#2d3748">approved-only manifests</text><text x="548.0" y="878" font-size="10" text-anchor="middle" fill="#2d3748">no canary · 8 s watchdog</text><text x="548.0" y="892" font-size="10" text-anchor="middle" fill="#2d3748">long slices, low perf caps</text><rect x="660" y="826" width="196" height="84" rx="8" fill="#F1ECFA" stroke="#6B46C1" stroke-width="1.5"/><text x="758.0" y="846" font-size="12" font-weight="700" text-anchor="middle" fill="#1a202c">automotive</text><text x="758.0" y="864" font-size="10" text-anchor="middle" fill="#2d3748">approved-only + allow-list</text><text x="758.0" y="878" font-size="10" text-anchor="middle" fill="#2d3748">ui video camera graphics</text><text x="758.0" y="892" font-size="10" text-anchor="middle" fill="#2d3748">1 s watchdog · canary</text><rect x="870" y="826" width="196" height="84" rx="8" fill="#F1ECFA" stroke="#6B46C1" stroke-width="1.5"/><text x="968.0" y="846" font-size="12" font-weight="700" text-anchor="middle" fill="#1a202c">vm (QEMU)</text><text x="968.0" y="864" font-size="10" text-anchor="middle" fill="#2d3748">CI target: q35 + virt</text><text x="968.0" y="878" font-size="10" text-anchor="middle" fill="#2d3748">x86_64 and arm64</text><text x="968.0" y="892" font-size="10" text-anchor="middle" fill="#2d3748">same canary + e2e tests</text></svg>
