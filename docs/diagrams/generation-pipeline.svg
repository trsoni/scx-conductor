<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="1100" height="580" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="On-device generation: model writes the scheduler, gates and the kernel check it, an operator approves, a signed digest loads it"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/></marker></defs><rect width="1100" height="580" fill="#ffffff"/><text x="550.0" y="22" font-size="16" font-weight="700" text-anchor="middle" fill="#1a202c">On-device generation: model writes the scheduler, gates and the kernel check it, an operator approves, a signed digest loads it</text><rect x="30" y="52" width="184" height="128" rx="8" fill="#F4F4F5" stroke="#71717A" stroke-width="1.5"/><text x="122.0" y="73" font-size="13" font-weight="700" text-anchor="middle" fill="#1a202c">1 Context</text><text x="122.0" y="91.5" font-size="10.5" text-anchor="middle" fill="#2d3748">numbers only: workload,</text><text x="122.0" y="106.0" font-size="10.5" text-anchor="middle" fill="#2d3748">platform, power state, arch,</text><text x="122.0" y="120.5" font-size="10.5" text-anchor="middle" fill="#2d3748">kernel, CPUs, limits, baseline</text><text x="122.0" y="135.0" font-size="10.5" text-anchor="middle" fill="#2d3748">+ 3 repo files as examples</text><rect x="244" y="52" width="184" height="128" rx="8" fill="#FDF3E1" stroke="#B7791F" stroke-width="1.5"/><text x="336.0" y="73" font-size="13" font-weight="700" text-anchor="middle" fill="#1a202c">2 Backend</text><text x="336.0" y="91.5" font-size="10.5" text-anchor="middle" fill="#2d3748">anthropic API | local command</text><text x="336.0" y="106.0" font-size="10.5" text-anchor="middle" fill="#2d3748">| template (tests)</text><text x="336.0" y="120.5" font-size="10.5" text-anchor="middle" fill="#2d3748">writes ONE C source file</text><text x="336.0" y="135.0" font-size="10.5" text-anchor="middle" fill="#2d3748">one request in, one file out</text><rect x="458" y="52" width="184" height="128" rx="8" fill="#EAF2FB" stroke="#2B6CB0" stroke-width="1.5"/><text x="550.0" y="73" font-size="13" font-weight="700" text-anchor="middle" fill="#1a202c">3 Static gate</text><text x="550.0" y="91.5" font-size="10.5" text-anchor="middle" fill="#2d3748">ASCII, &lt;= 48 KB, 2 includes</text><text x="550.0" y="106.0" font-size="10.5" text-anchor="middle" fill="#2d3748">no asm / extern / SEC / ##</text><text x="550.0" y="120.5" font-size="10.5" text-anchor="middle" fill="#2d3748">kfunc + helper allowlists</text><text x="550.0" y="135.0" font-size="10.5" text-anchor="middle" fill="#2d3748">fixed ops table + name</text><rect x="672" y="52" width="184" height="128" rx="8" fill="#EAF2FB" stroke="#2B6CB0" stroke-width="1.5"/><text x="764.0" y="73" font-size="13" font-weight="700" text-anchor="middle" fill="#1a202c">4 Build</text><text x="764.0" y="91.5" font-size="10.5" text-anchor="middle" fill="#2d3748">clang -target bpf -Wall</text><text x="764.0" y="106.0" font-size="10.5" text-anchor="middle" fill="#2d3748">ELF sections + 4 ABI maps</text><text x="764.0" y="120.5" font-size="10.5" text-anchor="middle" fill="#2d3748">bpftool skeleton</text><text x="764.0" y="135.0" font-size="10.5" text-anchor="middle" fill="#2d3748">cc -&gt; gen_load (loader)</text><rect x="886" y="52" width="184" height="128" rx="8" fill="#E9F6EC" stroke="#2F855A" stroke-width="1.5"/><text x="978.0" y="73" font-size="13" font-weight="700" text-anchor="middle" fill="#1a202c">5 Kernel verifier</text><text x="978.0" y="91.5" font-size="10.5" text-anchor="middle" fill="#2d3748">gen_load --verify-only:</text><text x="978.0" y="106.0" font-size="10.5" text-anchor="middle" fill="#2d3748">struct_ops loaded, NOT attached</text><text x="978.0" y="120.5" font-size="10.5" text-anchor="middle" fill="#2d3748">kernel proves memory safety</text><text x="978.0" y="135.0" font-size="10.5" text-anchor="middle" fill="#2d3748">and termination</text><line x1="214" y1="116.0" x2="244" y2="116.0" stroke="#4A5568" stroke-width="1.6" marker-end="url(#ah)"/><line x1="428" y1="116.0" x2="458" y2="116.0" stroke="#4A5568" stroke-width="1.6" marker-end="url(#ah)"/><line x1="642" y1="116.0" x2="672" y2="116.0" stroke="#4A5568" stroke-width="1.6" marker-end="url(#ah)"/><line x1="856" y1="116.0" x2="886" y2="116.0" stroke="#4A5568" stroke-width="1.6" marker-end="url(#ah)"/><rect x="244" y="208" width="612" height="44" rx="8" fill="#FDECEC" stroke="#C53030" stroke-width="1.5"/><text x="550.0" y="235.25" font-size="10.5" text-anchor="middle" fill="#2d3748">error text goes back to the model, up to 3 attempts (stored as 'failed' for debugging)</text><line x1="304" y1="208" x2="304" y2="180" stroke="#4A5568" stroke-width="1.6" marker-end="url(#ah)"/><text x="280" y="190" font-size="10" text-anchor="end" fill="#4A5568" font-style="italic">repair</text><line x1="550.0" y1="180" x2="550.0" y2="208" stroke="#4A5568" stroke-width="1.6" marker-end="url(#ah)"/><line x1="764.0" y1="180" x2="764.0" y2="208" stroke="#4A5568" stroke-width="1.6" marker-end="url(#ah)"/><polyline points="912,180 912,230 856,230" fill="none" stroke="#4A5568" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/><rect x="886" y="300" width="184" height="128" rx="8" fill="#E9F6EC" stroke="#2F855A" stroke-width="1.5"/><text x="978.0" y="321" font-size="13" font-weight="700" text-anchor="middle" fill="#1a202c">6 Early canary</text><text x="978.0" y="339.5" font-size="10.5" text-anchor="middle" fill="#2d3748">partial mode, probe + hogs</text><text x="978.0" y="354.0" font-size="10.5" text-anchor="middle" fill="#2d3748">only if no other sched_ext</text><text x="978.0" y="368.5" font-size="10.5" text-anchor="middle" fill="#2d3748">scheduler is attached</text><text x="978.0" y="383.0" font-size="10.5" text-anchor="middle" fill="#2d3748">fail -&gt; rejected, not repaired</text><rect x="672" y="300" width="184" height="128" rx="8" fill="#FFFFFF" stroke="#4A5568" stroke-width="1.5"/><text x="764.0" y="321" font-size="13" font-weight="700" text-anchor="middle" fill="#1a202c">7 PENDING artifact</text><text x="764.0" y="339.5" font-size="10.5" text-anchor="middle" fill="#2d3748">id = sha256(source)[:12]</text><text x="764.0" y="354.0" font-size="10.5" text-anchor="middle" fill="#2d3748">for one (workload, platform,</text><text x="764.0" y="368.5" font-size="10.5" text-anchor="middle" fill="#2d3748">arch, kernel release)</text><text x="764.0" y="383.0" font-size="10.5" text-anchor="middle" fill="#2d3748">never loadable as is</text><rect x="458" y="300" width="184" height="128" rx="8" fill="#FDF3E1" stroke="#B7791F" stroke-width="1.5"/><text x="550.0" y="321" font-size="13" font-weight="700" text-anchor="middle" fill="#1a202c">8 Operator approval</text><text x="550.0" y="339.5" font-size="10.5" text-anchor="middle" fill="#2d3748">conductord gen-approve &lt;id&gt;</text><text x="550.0" y="354.0" font-size="10.5" text-anchor="middle" fill="#2d3748">human reads review.md and the</text><text x="550.0" y="368.5" font-size="10.5" text-anchor="middle" fill="#2d3748">diff vs the reference</text><text x="550.0" y="383.0" font-size="10.5" text-anchor="middle" fill="#2d3748">signs approval.json (digests)</text><rect x="244" y="300" width="184" height="128" rx="8" fill="#EAF2FB" stroke="#2B6CB0" stroke-width="1.5"/><text x="336.0" y="321" font-size="13" font-weight="700" text-anchor="middle" fill="#1a202c">9 Signed manifest</text><text x="336.0" y="339.5" font-size="10.5" text-anchor="middle" fill="#2d3748">GenForge, template=scx_gen</text><text x="336.0" y="354.0" font-size="10.5" text-anchor="middle" fill="#2d3748">pins obj, loader, source,</text><text x="336.0" y="368.5" font-size="10.5" text-anchor="middle" fill="#2d3748">approval digests, kernel</text><text x="336.0" y="383.0" font-size="10.5" text-anchor="middle" fill="#2d3748">release, ops name, TTL</text><rect x="30" y="300" width="184" height="128" rx="8" fill="#EAF2FB" stroke="#2B6CB0" stroke-width="1.5"/><text x="122.0" y="321" font-size="13" font-weight="700" text-anchor="middle" fill="#1a202c">10 Verify, canary, load</text><text x="122.0" y="339.5" font-size="10.5" text-anchor="middle" fill="#2d3748">same fail-closed Verifier</text><text x="122.0" y="354.0" font-size="10.5" text-anchor="middle" fill="#2d3748">canary + starvation + telemetry</text><text x="122.0" y="368.5" font-size="10.5" text-anchor="middle" fill="#2d3748">load, sysfs ops == conductor_gen</text><text x="122.0" y="383.0" font-size="10.5" text-anchor="middle" fill="#2d3748">any failure: template scheduler</text><line x1="978.0" y1="180" x2="978.0" y2="300" stroke="#4A5568" stroke-width="1.6" marker-end="url(#ah)"/><text x="986.0" y="264" font-size="10" text-anchor="start" fill="#2d3748" font-style="italic">built + verified</text><line x1="886" y1="364.0" x2="856" y2="364.0" stroke="#4A5568" stroke-width="1.6" marker-end="url(#ah)"/><line x1="672" y1="364.0" x2="642" y2="364.0" stroke="#4A5568" stroke-width="1.6" marker-end="url(#ah)"/><line x1="458" y1="364.0" x2="428" y2="364.0" stroke="#4A5568" stroke-width="1.6" marker-end="url(#ah)"/><line x1="244" y1="364.0" x2="214" y2="364.0" stroke="#4A5568" stroke-width="1.6" marker-end="url(#ah)"/><rect x="30" y="462" width="330" height="96" rx="8" fill="#FFFFFF" stroke="#4A5568" stroke-width="1.5"/><text x="195.0" y="483" font-size="13" font-weight="700" text-anchor="middle" fill="#1a202c">Who can stop it</text><text x="195.0" y="501.5" font-size="10.5" text-anchor="middle" fill="#2d3748">the kernel: verifier, and the watchdog that</text><text x="195.0" y="516.0" font-size="10.5" text-anchor="middle" fill="#2d3748">ejects a stalled scheduler by itself</text><text x="195.0" y="530.5" font-size="10.5" text-anchor="middle" fill="#2d3748">a human: nothing loads without step 8</text><text x="195.0" y="545.0" font-size="10.5" text-anchor="middle" fill="#2d3748">the Verifier: any changed byte, arch or kernel</text><rect x="385" y="462" width="330" height="96" rx="8" fill="#FFFFFF" stroke="#4A5568" stroke-width="1.5"/><text x="550.0" y="483" font-size="13" font-weight="700" text-anchor="middle" fill="#1a202c">What goes off the device</text><text x="550.0" y="501.5" font-size="10.5" text-anchor="middle" fill="#2d3748">only the step 1 prompt, and only for the</text><text x="550.0" y="516.0" font-size="10.5" text-anchor="middle" fill="#2d3748">anthropic backend (gen --print-prompt shows it)</text><text x="550.0" y="530.5" font-size="10.5" text-anchor="middle" fill="#2d3748">no process names, paths, users or logs</text><text x="550.0" y="545.0" font-size="10.5" text-anchor="middle" fill="#2d3748">command / template backends stay local</text><rect x="740" y="462" width="330" height="96" rx="8" fill="#FDECEC" stroke="#C53030" stroke-width="1.5"/><text x="905.0" y="483" font-size="13" font-weight="700" text-anchor="middle" fill="#1a202c">Not proven by any of this</text><text x="905.0" y="501.5" font-size="10.5" text-anchor="middle" fill="#2d3748">that the scheduler is fair or fast: the verifier</text><text x="905.0" y="516.0" font-size="10.5" text-anchor="middle" fill="#2d3748">checks safety, not quality. That is what the</text><text x="905.0" y="530.5" font-size="10.5" text-anchor="middle" fill="#2d3748">canary, the runtime guard and the operator</text><text x="905.0" y="545.0" font-size="10.5" text-anchor="middle" fill="#2d3748">are for. Untuned, unmeasured.</text></svg>
